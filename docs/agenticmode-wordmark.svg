<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270" role="img" aria-labelledby="title description">
  <title id="title">Agentic Mode</title>
  <desc id="description">The Agentic Mode terminal splash wordmark rendered in cyan and green ASCII lettering.</desc>
  <defs>
    <linearGradient id="terminal-shimmer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.48" stop-color="#22d3ee"/>
      <stop offset="0.67" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="620" height="270" rx="18" fill="#0b1220"/>
  <g fill="url(#terminal-shimmer)" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18" font-weight="700" text-anchor="middle" xml:space="preserve">
    <text x="310" y="28"> ###   #### ##### #   # ##### #####  ####</text>
    <text x="310" y="50">#   # #     #     ##  #   #     #   #    </text>
    <text x="310" y="72">##### # ### ####  # # #   #     #   #    </text>
    <text x="310" y="94">#   # #   # #     #  ##   #     #   #    </text>
    <text x="310" y="116">#   #  ###  ##### #   #   #   #####  ####</text>
    <text x="310" y="164">         #   #  ###  ####  #####         </text>
    <text x="310" y="186">         ## ## #   # #   # #             </text>
    <text x="310" y="208">         # # # #   # #   # ####          </text>
    <text x="310" y="230">         #   # #   # #   # #             </text>
    <text x="310" y="252">         #   #  ###  ####  #####         </text>
  </g>
</svg>
