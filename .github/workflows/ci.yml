name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and build Go UI
        run: |
          go mod verify
          go test ./...
          ./scripts/build-ui.sh "$RUNNER_TEMP/agenticmode-ui"
          lipo -archs "$RUNNER_TEMP/agenticmode-ui" | grep -q arm64
          lipo -archs "$RUNNER_TEMP/agenticmode-ui" | grep -q x86_64
      - name: Test release packaging
        run: ./tests/test_packaging.sh
      - name: Test interactive launcher bridge
        run: ./tests/test_menu.sh
      - name: Run shell tests
        run: ./tests/test_agenticmode.sh
      - name: Check Homebrew formula
        run: |
          brew style Formula/agenticmode.rb
          brew tap-new --no-git agenticmode/local
          cp Formula/agenticmode.rb "$(brew --repository agenticmode/local)/Formula/agenticmode.rb"
          brew audit --strict agenticmode/local/agenticmode
          brew install --build-from-source agenticmode/local/agenticmode
          brew test agenticmode/local/agenticmode
